name: yag_model

channels:
  - conda-forge

dependencies:
  - python=3.11

  # build tools
  - cmake
  - ninja
  - compilers
  - pkg-config
  - scikit-build-core
  - clang-format>=18

  # python
  - numpy
  - scipy
  - matplotlib
  - ipykernel
  - pip
  - optuna
  - optuna-dashboard
  - pybind11-stubgen

  # c++ libs
  - pybind11
  - xtensor
  - xtensor-blas
  - xtensor-python
  - xtl
  - libopenblas
  - blas-devel
  - hdf5
  - highfive

  # testing
  - catch2
  - pytest