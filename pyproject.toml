[build-system]
requires = [
    "scikit-build-core",
    "pybind11",
    "cmake",
    "ninja",
    "numpy"
]
build-backend = "scikit_build_core.build"

[project]
name = "yag_model"
version = "0.1.0"

# if building for practical use:
[tool.scikit-build]
cmake.build-type = "Release"
# if profiling for profiling:
# [tool.scikit-build]
# cmake.build-type = "RelWithDebInfo"

build-dir = "build/{wheel_tag}"
