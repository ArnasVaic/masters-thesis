<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documents</title>
    <style>
      :root {
        --bg: #05060d;
        --accent-a: #8b5cf6;
        --accent-b: #22d3ee;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.12);
        --text: #eef1fb;
        --text-dim: #9aa3c0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8vh 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system,
          "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
        position: relative;
      }

      /* ---------- space backdrop ---------- */

      #stars {
        position: fixed;
        inset: 0;
        z-index: -3;
        display: block;
      }

      .nebula {
        position: fixed;
        inset: -20%;
        z-index: -2;
        pointer-events: none;
        background: radial-gradient(
            38% 30% at 22% 28%,
            rgba(139, 92, 246, 0.35),
            transparent 60%
          ),
          radial-gradient(
            32% 26% at 78% 66%,
            rgba(34, 211, 238, 0.28),
            transparent 60%
          ),
          radial-gradient(
            45% 40% at 60% 15%,
            rgba(236, 72, 153, 0.14),
            transparent 65%
          );
        filter: blur(40px) saturate(120%);
        animation: drift 30s ease-in-out infinite alternate;
      }

      @keyframes drift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(-2%, 2%, 0) scale(1.08);
        }
      }

      /* film-grain overlay */
      .grain {
        position: fixed;
        inset: -100px;
        z-index: -1;
        pointer-events: none;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        background-size: 160px 160px;
        animation: grain-shift 1s steps(6) infinite;
      }

      @keyframes grain-shift {
        0% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-4%, 2%);
        }
        40% {
          transform: translate(3%, -3%);
        }
        60% {
          transform: translate(-2%, -4%);
        }
        80% {
          transform: translate(4%, 3%);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      /* ---------- page content ---------- */

      main {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(
          100deg,
          #ffffff 20%,
          var(--accent-b) 50%,
          var(--accent-a) 80%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        animation: shine 6s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .kicker {
        margin: 0 0 40px;
        color: var(--text-dim);
        font-size: 0.85rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      li {
        width: 100%;
        border-radius: 16px;
        cursor: grab;
        transition: transform 0.2s ease;
      }

      li.dragging {
        opacity: 0.35;
      }

      li.drag-over {
        transform: scale(1.02);
      }

      .doc-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 18px 22px;
        border-radius: 16px;
        text-decoration: none;
        color: var(--text);
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        overflow: hidden;
        isolation: isolate;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      }

      /* glossy sweep */
      .doc-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        z-index: -1;
        background: linear-gradient(
          115deg,
          transparent 20%,
          rgba(255, 255, 255, 0.16) 42%,
          rgba(255, 255, 255, 0.02) 52%,
          transparent 70%
        );
        background-size: 250% 250%;
        background-position: 120% 0%;
        transition: background-position 0.7s ease;
      }

      .doc-card:hover::before,
      .doc-card:focus-visible::before {
        background-position: -20% 0%;
      }

      /* soft glow ring */
      .doc-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        z-index: -1;
        background: linear-gradient(
          120deg,
          var(--accent-a),
          var(--accent-b)
        );
        opacity: 0;
        -webkit-mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        transition: opacity 0.3s ease;
      }

      .doc-card:hover,
      .doc-card:focus-visible {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45),
          0 0 24px rgba(139, 92, 246, 0.18);
        outline: none;
      }

      .doc-card:hover::after,
      .doc-card:focus-visible::after {
        opacity: 1;
      }

      .doc-card:active {
        transform: translateY(-1px) scale(0.97);
      }

      .grip {
        flex: none;
        display: grid;
        grid-template-columns: repeat(2, 3px);
        gap: 3px;
        opacity: 0.35;
        transition: opacity 0.2s ease;
      }

      .grip span {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--text-dim);
      }

      li:hover .grip {
        opacity: 0.7;
      }

      .doc-label {
        flex: 1;
        text-align: left;
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .doc-badge {
        flex: none;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 5px 10px;
        border-radius: 999px;
        color: #0a0d1a;
        background: linear-gradient(120deg, var(--accent-b), var(--accent-a));
      }

      .ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.5) 0%,
          rgba(255, 255, 255, 0) 70%
        );
        pointer-events: none;
        animation: ripple-anim 0.7s ease-out forwards;
      }

      @keyframes ripple-anim {
        to {
          transform: scale(3.2);
          opacity: 0;
        }
      }

      footer {
        margin-top: 48px;
        font-size: 0.75rem;
        color: var(--text-dim);
        letter-spacing: 0.04em;
      }

      @media (prefers-reduced-motion: reduce) {
        .nebula,
        .grain,
        h1 {
          animation: none !important;
        }
        .doc-card,
        li {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stars"></canvas>
    <div class="nebula"></div>
    <div class="grain"></div>

    <main>
      <h1>Documents</h1>
      <p class="kicker">Master's Thesis</p>

      <ul id="doc-list">
        <li draggable="true">
          <a class="doc-card" href="plan.pdf">
            <span class="grip"><span></span><span></span><span></span><span></span></span>
            <span class="doc-label">Research plan</span>
            <span class="doc-badge">PDF</span>
          </a>
        </li>
        <li draggable="true">
          <a class="doc-card" href="thesis.pdf">
            <span class="grip"><span></span><span></span><span></span><span></span></span>
            <span class="doc-label">Thesis</span>
            <span class="doc-badge">PDF</span>
          </a>
        </li>
        <li draggable="true">
          <a class="doc-card" href="supervisor-declaration.pdf">
            <span class="grip"><span></span><span></span><span></span><span></span></span>
            <span class="doc-label">Declaration of meetings with the supervisor</span>
            <span class="doc-badge">PDF</span>
          </a>
        </li>
      </ul>
    </main>

    <script>
      // ---- starfield ----
      (function () {
        var canvas = document.getElementById("stars");
        var ctx = canvas.getContext("2d");
        var stars = [];
        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        var w, h;

        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          var count = Math.min(220, Math.floor((w * h) / 6000));
          stars = [];
          for (var i = 0; i < count; i++) {
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: Math.random() * 1.3 + 0.2,
              phase: Math.random() * Math.PI * 2,
              speed: 0.01 + Math.random() * 0.02,
            });
          }
        }

        function draw(t) {
          ctx.clearRect(0, 0, w, h);
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var tw = reduceMotion
              ? 0.8
              : 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255," + tw + ")";
            ctx.fill();
          }
          if (!reduceMotion) requestAnimationFrame(draw);
        }

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(draw);
        if (reduceMotion) draw(0);
      })();

      // ---- drag to reorder ----
      (function () {
        var list = document.getElementById("doc-list");
        var dragging = null;

        list.addEventListener("dragstart", function (e) {
          dragging = e.target.closest("li");
          dragging.classList.add("dragging");
        });

        list.addEventListener("dragend", function () {
          if (dragging) dragging.classList.remove("dragging");
          dragging = null;
          Array.prototype.forEach.call(
            list.querySelectorAll("li"),
            function (li) {
              li.classList.remove("drag-over");
            }
          );
        });

        list.addEventListener("dragover", function (e) {
          e.preventDefault();
          var target = e.target.closest("li");
          if (!target || target === dragging) return;
          var rect = target.getBoundingClientRect();
          var before = e.clientY - rect.top < rect.height / 2;
          list.insertBefore(dragging, before ? target : target.nextSibling);
        });
      })();

      // ---- click ripple + delayed navigation ----
      (function () {
        var cards = document.querySelectorAll(".doc-card");
        cards.forEach(function (card) {
          card.addEventListener("click", function (e) {
            var parentLi = card.closest("li");
            if (parentLi && parentLi.classList.contains("dragging")) {
              e.preventDefault();
              return;
            }

            e.preventDefault();
            var rect = card.getBoundingClientRect();
            var ripple = document.createElement("span");
            var size = Math.max(rect.width, rect.height) * 1.2;
            ripple.className = "ripple";
            ripple.style.width = ripple.style.height = size + "px";
            ripple.style.left = e.clientX - rect.left - size / 2 + "px";
            ripple.style.top = e.clientY - rect.top - size / 2 + "px";
            card.appendChild(ripple);
            ripple.addEventListener("animationend", function () {
              ripple.remove();
            });

            var href = card.getAttribute("href");
            setTimeout(function () {
              window.location.href = href;
            }, 260);
          });
        });
      })();
    </script>
  </body>
</html>
